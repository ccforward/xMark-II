<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Bookmark Sync</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f0f;
      color: #e7e9ea;
      width: 320px;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
    }
    .stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #71767b;
    }
    .stat-value {
      color: #e7e9ea;
      font-weight: 600;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-align: center;
    }
    .btn-primary {
      background: #1d9bf0;
      color: white;
    }
    .btn-primary:hover { background: #1a8cd8; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: #1d1f23;
      color: #e7e9ea;
      border: 1px solid #2f3336;
    }
    .btn-secondary:hover { background: #2f3336; }
    .status {
      font-size: 12px;
      color: #71767b;
      text-align: center;
      margin-bottom: 8px;
    }
    .status.error { color: #f4212e; }
    .status.syncing { color: #1d9bf0; }
    .status.success { color: #00ba7c; }
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #2f3336;
      border-top-color: #1d9bf0;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
      margin-right: 4px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .open-dashboard {
      display: block;
      text-align: center;
      color: #1d9bf0;
      font-size: 13px;
      margin-top: 12px;
      cursor: pointer;
      text-decoration: none;
    }
    .open-dashboard:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <span class="title">XB Sync</span>
  </div>

  <div class="stats">
    <div class="stat-row">
      <span>Total bookmarks</span>
      <span class="stat-value" id="bookmarkCount">-</span>
    </div>
    <div class="stat-row">
      <span>Last sync</span>
      <span class="stat-value" id="lastSync">Never</span>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="actions">
    <button class="btn btn-primary" id="syncBtn">Sync</button>
    <button class="btn btn-secondary" id="fullSyncBtn">Full Sync</button>
  </div>

  <a class="open-dashboard" id="openDashboard" href="#">Open Dashboard</a>

  <script src="popup.js"></script>
</body>
</html>
